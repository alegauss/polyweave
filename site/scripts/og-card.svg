<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="polyweave — Claude Code makes your game's parts, and you approve them">
  <defs>
    <linearGradient id="pw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
    <radialGradient id="pw-glow" cx="0.84" cy="0.04" r="0.72">
      <stop offset="0" stop-color="#21C1A6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#21C1A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pw-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21C1A6"/>
      <stop offset="1" stop-color="#5FE0C9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#pw-bg)"/>
  <rect width="1200" height="630" fill="url(#pw-glow)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#pw-rule)"/>

  <!-- The mark. prerender.mjs substitutes public/logo.svg here, positioned and scaled by the
       constants it holds, so the card carries no copy of the artwork to fall behind it. -->
  {{mark}}

  <text x="252" y="164" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#dedede">polyweave</text>
  <text x="254" y="200" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8f8f8f">part of alegauss</text>

  <text x="90" y="348" font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="bold" fill="#dedede">Claude Code makes the parts.</text>
  <text x="90" y="420" font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="bold" fill="#5FE0C9">You approve them.</text>

  <text x="92" y="486" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#aeaeae">The plugin between Claude Code and Blender, Godot and AI generators.</text>

  <!-- The status chip. It carries no count on purpose: the counts on the site are generated
       from the roadmap and this card is rasterised from a template, so a number typed here
       is the one thing on it that could quietly go stale. The pill has no width of its own
       either — prerender.mjs measures the text and fits it, because a width typed here is a
       width measured against whichever font the machine that typed it happened to have. -->
  <rect x="90" y="530" width="{{chip-width}}" height="46" rx="23" fill="#232323" stroke="#3a3a3a"/>
  <circle cx="118" cy="553" r="6" fill="#21C1A6"/>
  <text id="chip" x="136" y="561" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#aeaeae">3D · images · music · sound · effects · kits</text>

  <text x="1110" y="561" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8f8f8f">alegauss.github.io/polyweave</text>
</svg>
