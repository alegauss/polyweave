<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -20 1060 707" width="1000" height="667">
  <!-- The PlayStation-layout pad seen from above, its face toward the bottom of the
       picture, at the front view's width: the view Meshy is given beside the front and
       the side (§PW428), so the shoulders read as they are: L1 and R1 long bars along
       the front of each shoulder, L2 and R2 curved triggers just behind them. -->
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cdd4"/>
      <stop offset="1" stop-color="#f3f4f6"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181c"/>
      <stop offset="1" stop-color="#3a3e46"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d8de"/>
    </linearGradient>
  </defs>

  <!-- the body from above: wide at the front, its back rounded, the grips reaching back -->
  <path d="M 110 470 C 80 470 62 440 66 400 C 74 300 110 190 190 160 C 250 140 330 150 380 176 C 440 200 560 200 620 176 C 670 150 750 140 810 160 C 890 190 926 300 934 400 C 938 440 920 470 890 470 Z" fill="url(#wing)" stroke="#8d939c" stroke-width="3"/>
  <!-- the black core in the middle, between the grips -->
  <path d="M 340 470 C 360 330 400 214 440 200 L 560 200 C 600 214 640 330 660 470 Z" fill="url(#dark)" stroke="#0b0c0f" stroke-width="2"/>

  <!-- L2 and R2: curved triggers behind the bumpers, dark -->
  <path d="M 166 408 L 168 372 C 200 352 300 352 336 372 L 338 408 Z" fill="url(#dark)" stroke="#0b0c0f" stroke-width="2.5"/>
  <path d="M 662 408 L 664 372 C 700 352 800 352 832 372 L 834 408 Z" fill="url(#dark)" stroke="#0b0c0f" stroke-width="2.5"/>
  <!-- L1 and R1: long rounded bars along the front of each shoulder -->
  <rect x="160" y="410" width="182" height="40" rx="20" fill="url(#bar)" stroke="#8d939c" stroke-width="2.5"/>
  <rect x="658" y="410" width="182" height="40" rx="20" fill="url(#bar)" stroke="#8d939c" stroke-width="2.5"/>

  <!-- the touchpad's top edge between the shoulders, white -->
  <rect x="362" y="448" width="276" height="22" rx="8" fill="url(#bar)" stroke="#a7adb6" stroke-width="2"/>
  <!-- the two sticks standing out from the face, seen from above -->
  <rect x="352" y="470" width="76" height="34" rx="8" fill="#22252b" stroke="#0b0c0f" stroke-width="2"/>
  <rect x="572" y="470" width="76" height="34" rx="8" fill="#22252b" stroke="#0b0c0f" stroke-width="2"/>
</svg>
