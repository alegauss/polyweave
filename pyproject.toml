[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `polyweave` on PyPI is an unrelated project, so the distribution is named apart and
# the import stays `polyweave` (§PW602). A remedy that says `pip install` names this.
name = "polyweave-gamekit"
dynamic = ["version"]
description = "Make a game's parts by declaring what each must satisfy: 3D assets, pictures, sound loops and the world's text, on top of Blender, Godot and paid generators."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Oliveira" }]
keywords = ["gamedev", "3d", "blender", "godot", "assets", "sound", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# Both are what a pixel question needs and neither is exotic: Blender bundles numpy, and
# the assertions and measurements here would otherwise decode PNG by hand.
dependencies = ["numpy>=1.26", "pillow>=10"]

# 3.11 is Blender 4.2's interpreter. Code here may have to run inside it, so nothing
# below that line is available to this package.

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6"]
# Blender is optional: `capabilities()` reports whether it is reachable and a render
# refuses without it, so importing polyweave never costs a renderer. The module route is
# what a worker uses; a blender binary named in `[paths]` is the other one.
blender = ["bpy>=4.2"]
# Rendering a score (§PW187) loads Surge XT and runs the mix through Pedalboard. Optional
# like Blender: music.render refuses by name without it, and nothing else imports it.
audio = ["pedalboard>=0.9"]
# Splitting a recorded track into stems (§PW558). Optional the same way, and heavy (torch):
# sound.stems refuses by name without it. CPU torch is enough.
stems = ["demucs>=4"]
# Outlining an SVG's live text before the engine draws it (§PW453). Optional the same
# way: an SVG with no text never imports it, and one with text refuses by name.
text = ["fonttools>=4.40"]

[project.urls]
Homepage = "https://alegauss.github.io/polyweave/"
Source = "https://github.com/alegauss/polyweave"
Issues = "https://github.com/alegauss/polyweave/issues"

# One number for the package, the MCP server's serverInfo and the provenance record; the
# plugin manifest is held to it by tests/test_packaging.py.
[tool.hatch.version]
path = "src/polyweave/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src/polyweave", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/polyweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
markers = [
    "serial: measures time on the machine, so the gate runs it alone after the rest",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"
# The hooks under `.claude` are this repository's plumbing rather than the plugin, and
# they predate any lint config here. The migration fixtures are two consumers' scripts
# copied as they were, which is what tests/test_migrate.py reads, so they are not ours
# to lint.
extend-exclude = [".claude", "tests/fixtures/migrate"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
