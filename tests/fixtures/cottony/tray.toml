name    = "board_tray"
version = 1
output  = "whole"

# `tools/art/tray_model.py`, as a declaration. Every number is that file's own, and the
# ones it computes inline are parameters here so a search can reach them.
#
# Restated in this format's conventions rather than the script's. `tray_model.py` works
# in image coordinates turned on their side and flips y into Blender's z on every ring;
# an outline here is a closed ring in XY and a solid extrudes it along Z, so the flip
# happens once, in the reading, and never again.
#
# Depth is turned round as well (§PW78). The script's camera stands at -y, so a smaller
# depth is nearer; here the camera stands at +Z, so a larger one is. Each `front` is the
# script's restated as -(front + depth). Copied across unturned, this tray rendered its
# own back: the right outline to the pixel over a flat slab with no seats in it.
[params]
cell      = 112
board     = 8
pad       = 44                        # BOARD_PAD
edge      = 18                        # the inset every box shares
lift      = 22                        # how far the side wall shows below the face
radius    = 68.0
piping    = 18.0
overlap   = 5.0                       # the rope's inner edge, further in than the cushion's
face_front = -46.0
seat_depth = 14.0
inset     = 7.0                       # how far a seat sits inside its own cell
seat_corner = 22.0
size      = "board * cell + 2 * pad - 2 * edge"   # 948, the face box's side

[materials.cushion]
colour    = "#F2E4D0"
roughness = 0.62

[materials.rope]
colour    = "#FFFAEE"

# The side wall: the same cushion dropped by `lift` and set back, so what shows below the
# face is the thickness of the tray rather than a painted band.
[[nodes]]
id       = "wall"
op       = "prism"
material = "cushion"
outline  = { shape = "rounded_square", size = "size", corner = "radius" }
depth    = 70.0
front    = "-(-6.0 + 70.0)"
at       = [0, "-lift", 0]

# The piped rim, standing proudest of anything: rule 1's rope, as geometry. **A ring and
# not a slab** — built solid it is a cream lid over the entire tray, which is exactly
# what the second render of that file was. Its inner edge runs `overlap` further in than
# the cushion's outer one, so the two overlap instead of sharing a surface: coincident,
# they z-fight, and the corners came back hatched with dark zigzags where the curvature
# made the tie visible.
[[nodes]]
id       = "rim"
op       = "annulus"
material = "rope"
outer    = { shape = "rounded_square", size = "size", corner = "radius" }
inner    = { of = { shape = "rounded_square", size = "size", corner = "radius" }, offset = "-(piping + overlap)" }
depth    = 60.0
front    = "-(-52.0 + 60.0)"

# The cushion face the seats are pressed into.
[[nodes]]
id       = "face"
op       = "prism"
material = "cushion"
outline  = { of = { shape = "rounded_square", size = "size", corner = "radius" }, offset = "-piping" }
depth    = 60.0
front    = "-(face_front + 60.0)"

# Sixty-four seats, pitched at `cell` from `pad` — the arithmetic `board.gd` does to place
# a piece, so a seat is under its cell by construction rather than by eye. The cutter stops
# `seat_depth` short of the back, so each pocket keeps a floor and the face stays one solid.
[[nodes]]
id      = "seat"
op      = "prism"
outline = { shape = "rounded_square", size = "cell - 2 * inset", corner = "seat_corner" }
depth   = "20.0 + seat_depth"
front   = "-(face_front - 20.0 + 20.0 + seat_depth)"
at      = ["pad + col * cell + cell / 2 - size / 2 - edge", "pad + row * cell + cell / 2 - size / 2 - edge", 0]
repeat  = [
  { var = "row", from = 0, to = "board - 1" },
  { var = "col", from = 0, to = "board - 1" },
]

# **Pockets rather than walls.** Two earlier constructions were wrong: raised bars between
# the cells gave a woven basket where the separators read as rungs laid on top, and cutting
# those bars into segments so their bevels would stop fighting turned them into a ladder of
# lozenges. What the reference shows is one continuous cushion with the seats pressed into
# it, so it is a boolean difference and the separators are simply the face that is left.
[[nodes]]
id     = "tray"
op     = "carve"
into   = "face"
cutter = "seat"

# One document names one output, and this model is four parts. Joining them is what makes
# the tray a thing the format can hand back — and it is a join and not a boolean, because
# these parts do not overlap. What the join does not carry is the two materials: the rope
# is `#FFFAEE` and the cushion is `#F2E4D0`, and a material sits on a node.
[[nodes]]
id     = "whole"
op     = "union"
inputs = ["wall", "rim", "tray"]
