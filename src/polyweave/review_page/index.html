<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polyweave review</title>
<style>
  :root {
    --ground: #f6f5f2; --panel: #ffffff; --ink: #1f1d1a; --quiet: #6b665e;
    --line: #dedad3; --accent: #3a5bd9; --fail: #b3261e; --pass: #1e7a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #17171a; --panel: #212126; --ink: #ecebe8; --quiet: #a09c95;
      --line: #34343b; --accent: #8aa2ff; --fail: #ff8a80; --pass: #7fd99a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--ground); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  .says { color: var(--quiet); margin: 0 0 16px; }
  .family {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; margin: 0 0 16px;
  }
  .family img {
    display: block; max-width: 100%; height: auto; border-radius: 4px;
    image-rendering: pixelated; background: #808080;
  }
  .member { margin: 8px 0 0; }
  .fails { color: var(--fail); } .passes { color: var(--pass); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 8px; }
  .choices label {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  .choices input { margin-right: 6px; }
  textarea {
    width: 100%; min-height: 56px; font: inherit; color: var(--ink);
    background: var(--ground); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px;
  }
  button {
    font: inherit; margin-top: 8px; padding: 8px 14px; border-radius: 6px; border: 0;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .answer { margin-top: 8px; color: var(--quiet); white-space: pre-wrap; }
  .mark { display: inline-block; margin: 8px 12px 0 0; vertical-align: top; }
  .mark .frame { position: relative; display: inline-block; }
  .mark img { max-width: 320px; image-rendering: pixelated; }
  .mark canvas {
    position: absolute; left: 0; top: 0; cursor: crosshair; touch-action: none;
  }
  .mark p { margin: 0 0 4px; color: var(--quiet); }
  .lane { margin: 12px 0 0; }
  .lane h3, .lane summary { font-size: 14px; margin: 0 0 8px; cursor: pointer; }
  .candidate {
    display: grid; grid-template-columns: minmax(0, 160px) 1fr; gap: 12px;
    border-top: 1px solid var(--line); padding: 8px 0;
  }
  .candidate img { max-width: 160px; }
  .candidate ul { margin: 0; padding-left: 18px; }
  .candidate form { grid-column: 1 / -1; }
  .compare { grid-column: 1 / -1; margin: 8px 0; }
  .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .tabs button { margin: 0; padding: 4px 10px; background: var(--line); color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
  .side { display: flex; gap: 8px; flex-wrap: wrap; }
  .side img, .layers img, .stage > div > img { max-width: 320px; }
  .layers { position: relative; display: inline-block; }
  .layers img + img { position: absolute; left: 0; top: 0; }
  .layers img.mask { opacity: 0.35; filter: invert(1); mix-blend-mode: multiply; }
  .compare input[type=range] { display: block; width: 320px; max-width: 100%; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch {
    padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--chip); color: #fff; text-shadow: 0 0 2px #000; font-size: 12px;
  }
  pre { background: var(--ground); padding: 8px; border-radius: 6px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); }
  td, th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
</style>
</head>
<body>
<main>
  <h1>polyweave review</h1>
  <p class="says" id="says">Reading what is on disk.</p>
  <section id="sittings"></section>
  <section id="gates"></section>
  <section id="meshes"></section>
  <h2>The canons</h2>
  <button type="button" id="show-canons">Show every family's canon</button>
  <section id="canons"></section>
  <h2>Where every asset stands</h2>
  <table id="pending"><thead><tr>
    <th>asset</th><th>waiting</th><th>newest candidate</th><th>last judged</th>
  </tr></thead><tbody></tbody></table>
</main>
<script src="/page.js"></script>
<script>document.getElementById("show-canons").addEventListener("click", () => drawCanons());</script>
</body>
</html>
