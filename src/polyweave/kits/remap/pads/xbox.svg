<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 667" width="1000" height="667">
  <!-- The remap kit's Xbox-layout pad (§PW428): a charcoal shell, offset sticks, the four
       face buttons in their layout's colours, in a 1000 x 667 frame. The "spots" group at
       the end draws nothing: it is where each place sits, and core/pads/xbox.json is held
       to it. No maker's mark. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5260"/>
      <stop offset="0.45" stop-color="#2c323d"/>
      <stop offset="1" stop-color="#171b22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ea2bf"/>
      <stop offset="1" stop-color="#2a3140"/>
    </linearGradient>
    <linearGradient id="trigger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b424e"/>
      <stop offset="1" stop-color="#1b1f27"/>
    </linearGradient>
    <linearGradient id="bumper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7584"/>
      <stop offset="1" stop-color="#2f353f"/>
    </linearGradient>
    <radialGradient id="well" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#0b0e13"/>
      <stop offset="0.8" stop-color="#151a22"/>
      <stop offset="1" stop-color="#2d3440"/>
    </radialGradient>
    <radialGradient id="cap" cx="0.42" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5d6676"/>
      <stop offset="0.6" stop-color="#2b313c"/>
      <stop offset="1" stop-color="#14181e"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="guide" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.45" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#1b6e9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- triggers, behind the shell -->
  <path d="M 178 18 Q 250 4 322 18 L 334 120 L 166 120 Z" fill="url(#trigger)" stroke="#5b6574" stroke-width="3"/>
  <path d="M 678 18 Q 750 4 822 18 L 834 120 L 666 120 Z" fill="url(#trigger)" stroke="#5b6574" stroke-width="3"/>
  <path d="M 196 30 Q 250 20 304 30" fill="none" stroke="#7d8898" stroke-width="3" stroke-linecap="round"/>
  <path d="M 696 30 Q 750 20 804 30" fill="none" stroke="#7d8898" stroke-width="3" stroke-linecap="round"/>

  <!-- shadow and shell -->
  <path d="M 300 142 L 700 142 C 800 132 870 162 900 272 C 930 392 950 532 900 622 C 870 672 800 672 760 622 C 720 572 680 532 620 527 L 380 527 C 320 532 280 572 240 622 C 200 672 130 672 100 622 C 50 532 70 392 100 272 C 130 162 200 132 300 142 Z" fill="#000" opacity="0.45" filter="url(#soft)"/>
  <path d="M 300 130 L 700 130 C 800 120 870 150 900 260 C 930 380 950 520 900 610 C 870 660 800 660 760 610 C 720 560 680 520 620 515 L 380 515 C 320 520 280 560 240 610 C 200 660 130 660 100 610 C 50 520 70 380 100 260 C 130 150 200 120 300 130 Z" fill="url(#shell)" stroke="url(#rim)" stroke-width="4"/>
  <path d="M 300 138 L 700 138 C 790 130 850 156 880 250 C 700 230 300 230 120 250 C 150 156 210 130 300 138 Z" fill="url(#sheen)"/>
  <!-- grip texture: fine ribs down each grip -->
  <g stroke="#0f1217" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M 110 470 L 160 600"/><path d="M 130 455 L 185 600"/><path d="M 150 440 L 210 595"/>
    <path d="M 890 470 L 840 600"/><path d="M 870 455 L 815 600"/><path d="M 850 440 L 790 595"/>
  </g>
  <!-- a cyan seam round the face, the ring's own line -->
  <path d="M 140 300 C 160 200 230 160 300 160 L 700 160 C 770 160 840 200 860 300" fill="none" stroke="#3fd2ff" stroke-width="2.5" opacity="0.55"/>

  <!-- bumpers -->
  <path d="M 168 112 Q 250 78 332 104 L 330 124 Q 250 104 172 132 Z" fill="url(#bumper)" stroke="#9aa6b8" stroke-width="2"/>
  <path d="M 832 112 Q 750 78 668 104 L 670 124 Q 750 104 828 132 Z" fill="url(#bumper)" stroke="#9aa6b8" stroke-width="2"/>

  <!-- the guide button, a plain ring of light -->
  <circle cx="500" cy="168" r="44" fill="url(#guide)" opacity="0.6"/>
  <circle cx="500" cy="168" r="24" fill="#20262f" stroke="#bff3ff" stroke-width="3"/>
  <circle cx="500" cy="168" r="11" fill="none" stroke="#7fe3ff" stroke-width="3"/>

  <!-- view and menu -->
  <circle cx="430" cy="215" r="15" fill="#1a1f27" stroke="#8b96a6" stroke-width="2"/>
  <rect x="421" y="207" width="12" height="10" rx="2" fill="none" stroke="#d6dde8" stroke-width="2"/>
  <rect x="427" y="213" width="12" height="10" rx="2" fill="#1a1f27" stroke="#d6dde8" stroke-width="2"/>
  <circle cx="570" cy="215" r="15" fill="#1a1f27" stroke="#8b96a6" stroke-width="2"/>
  <g stroke="#d6dde8" stroke-width="2.5" stroke-linecap="round">
    <path d="M 562 209 L 578 209"/><path d="M 562 215 L 578 215"/><path d="M 562 221 L 578 221"/>
  </g>

  <!-- left stick -->
  <circle cx="250" cy="250" r="64" fill="url(#well)" stroke="#3d4553" stroke-width="3"/>
  <circle cx="250" cy="250" r="46" fill="url(#cap)" stroke="#0b0d11" stroke-width="3"/>
  <circle cx="250" cy="250" r="34" fill="none" stroke="#4a5362" stroke-width="5" stroke-dasharray="4 5"/>
  <circle cx="250" cy="250" r="22" fill="#1d222a"/>
  <circle cx="250" cy="250" r="46" fill="url(#gloss)"/>
  <g fill="#9fb0c8">
    <path d="M 250 179 L 243 189 L 257 189 Z"/><path d="M 250 321 L 243 311 L 257 311 Z"/>
    <path d="M 179 250 L 189 243 L 189 257 Z"/><path d="M 321 250 L 311 243 L 311 257 Z"/>
  </g>

  <!-- right stick -->
  <circle cx="630" cy="400" r="64" fill="url(#well)" stroke="#3d4553" stroke-width="3"/>
  <circle cx="630" cy="400" r="46" fill="url(#cap)" stroke="#0b0d11" stroke-width="3"/>
  <circle cx="630" cy="400" r="34" fill="none" stroke="#4a5362" stroke-width="5" stroke-dasharray="4 5"/>
  <circle cx="630" cy="400" r="22" fill="#1d222a"/>
  <circle cx="630" cy="400" r="46" fill="url(#gloss)"/>
  <g fill="#9fb0c8">
    <path d="M 630 329 L 623 339 L 637 339 Z"/><path d="M 630 471 L 623 461 L 637 461 Z"/>
    <path d="M 559 400 L 569 393 L 569 407 Z"/><path d="M 701 400 L 691 393 L 691 407 Z"/>
  </g>

  <!-- D-pad -->
  <circle cx="370" cy="400" r="72" fill="url(#well)" stroke="#3d4553" stroke-width="3"/>
  <path d="M 352 340 L 388 340 L 388 382 L 430 382 L 430 418 L 388 418 L 388 460 L 352 460 L 352 418 L 310 418 L 310 382 L 352 382 Z" fill="#2a3039" stroke="#0b0d11" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 352 340 L 388 340 L 388 382 L 430 382" fill="none" stroke="#6b7686" stroke-width="2"/>
  <circle cx="370" cy="400" r="9" fill="#151920"/>
  <g fill="#b9c6d8">
    <path d="M 370 348 L 362 360 L 378 360 Z"/><path d="M 370 452 L 362 440 L 378 440 Z"/>
    <path d="M 318 400 L 330 392 L 330 408 Z"/><path d="M 422 400 L 410 392 L 410 408 Z"/>
  </g>

  <!-- face buttons: Y yellow, X blue, B red, A green -->
  <circle cx="750" cy="250" r="96" fill="url(#well)" stroke="#3d4553" stroke-width="3"/>
  <g>
    <circle cx="750" cy="190" r="27" fill="#2a2410" stroke="#f2c12e" stroke-width="4"/>
    <circle cx="750" cy="190" r="27" fill="url(#gloss)"/>
    <path transform="translate(750 190)" d="M -9 -10 L 0 0 L 9 -10 M 0 0 L 0 11" fill="none" stroke="#f2c12e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="690" cy="250" r="27" fill="#0f1c2e" stroke="#2f8bff" stroke-width="4"/>
    <circle cx="690" cy="250" r="27" fill="url(#gloss)"/>
    <path transform="translate(690 250)" d="M -9 -10 L 9 10 M 9 -10 L -9 10" fill="none" stroke="#4fa0ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="810" cy="250" r="27" fill="#2a1111" stroke="#ff4a3d" stroke-width="4"/>
    <circle cx="810" cy="250" r="27" fill="url(#gloss)"/>
    <path transform="translate(810 250)" d="M -7 -11 L -7 11 L 3 11 Q 10 11 10 5.5 Q 10 0 3 0 L -7 0 M 3 0 Q 9 0 9 -5.5 Q 9 -11 2 -11 L -7 -11" fill="none" stroke="#ff5a4d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="750" cy="310" r="27" fill="#102512" stroke="#43d15a" stroke-width="4"/>
    <circle cx="750" cy="310" r="27" fill="url(#gloss)"/>
    <path transform="translate(750 310)" d="M -10 11 L 0 -11 L 10 11 M -6 3 L 6 3" fill="none" stroke="#58e070" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the status light under the guide button -->
  <g fill="#3fd2ff" opacity="0.8">
    <circle cx="482" cy="226" r="3"/><circle cx="494" cy="226" r="3"/><circle cx="506" cy="226" r="3" opacity="0.35"/><circle cx="518" cy="226" r="3" opacity="0.35"/>
  </g>

  <!-- where each place sits, as the screen's spots table says it -->
  <g id="spots" fill="none">
    <circle data-code="axis:4:1" cx="250" cy="55" r="0"/>
    <circle data-code="button:9" cx="250" cy="102" r="0"/>
    <circle data-code="axis:1:-1" cx="250" cy="184" r="0"/>
    <circle data-code="axis:0:-1" cx="184" cy="250" r="0"/>
    <circle data-code="button:7" cx="250" cy="250" r="0"/>
    <circle data-code="axis:0:1" cx="316" cy="250" r="0"/>
    <circle data-code="axis:1:1" cx="250" cy="316" r="0"/>
    <circle data-code="button:11" cx="370" cy="356" r="0"/>
    <circle data-code="button:13" cx="326" cy="400" r="0"/>
    <circle data-code="button:14" cx="414" cy="400" r="0"/>
    <circle data-code="button:12" cx="370" cy="444" r="0"/>
    <circle data-code="button:4" cx="430" cy="215" r="0"/>
    <circle data-code="button:6" cx="570" cy="215" r="0"/>
    <circle data-code="axis:5:1" cx="750" cy="55" r="0"/>
    <circle data-code="button:10" cx="750" cy="102" r="0"/>
    <circle data-code="button:3" cx="750" cy="190" r="0"/>
    <circle data-code="button:2" cx="690" cy="250" r="0"/>
    <circle data-code="button:1" cx="810" cy="250" r="0"/>
    <circle data-code="button:0" cx="750" cy="310" r="0"/>
    <circle data-code="axis:3:-1" cx="630" cy="334" r="0"/>
    <circle data-code="axis:2:-1" cx="564" cy="400" r="0"/>
    <circle data-code="button:8" cx="630" cy="400" r="0"/>
    <circle data-code="axis:2:1" cx="696" cy="400" r="0"/>
    <circle data-code="axis:3:1" cx="630" cy="466" r="0"/>
  </g>
</svg>
