<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 667" width="1000" height="667">
  <!-- The remap kit's PlayStation-layout pad (§PW428), drawn after the current pad's own
       shape: a black body whose wide top and thick grips splay outward, two white wings
       wrapping each side and shoulder, a white touchpad across the top with its light bar
       either side, the d-pad as four arrows and the face buttons as their symbols on the
       wings, the sticks level in the black middle, in a 1000 x 667 frame. The "spots"
       group at the end draws nothing: it is where each place sits, and
       core/pads/playstation.json is held to it. No maker's mark. -->
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="0.6" stop-color="#e3e5e9"/>
      <stop offset="1" stop-color="#c3c7ce"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe2e7"/>
    </linearGradient>
    <linearGradient id="trigger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e46"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="bumper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd3d9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6fb0ff"/>
      <stop offset="1" stop-color="#4f9bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.42" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4c5059"/>
      <stop offset="0.6" stop-color="#22252b"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </radialGradient>
    <radialGradient id="well" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#08090b"/>
      <stop offset="1" stop-color="#1b1d22"/>
    </radialGradient>
    <radialGradient id="face" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#c8ccd3"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- L2 and R2, dark, behind the shoulders -->
  <path d="M 178 72 Q 250 46 322 66 L 330 140 L 172 150 Z" fill="url(#trigger)" stroke="#4a4f58" stroke-width="3"/>
  <path d="M 822 72 Q 750 46 678 66 L 670 140 L 828 150 Z" fill="url(#trigger)" stroke="#4a4f58" stroke-width="3"/>
  <!-- L1 and R1, white, on the shoulders -->
  <path d="M 160 150 Q 240 108 330 128 L 334 152 Q 240 138 170 172 Z" fill="url(#bumper)" stroke="#9aa0aa" stroke-width="2"/>
  <path d="M 840 150 Q 760 108 670 128 L 666 152 Q 760 138 830 172 Z" fill="url(#bumper)" stroke="#9aa0aa" stroke-width="2"/>

  <!-- the body: a wide top, grips that splay out and round off, a shallow U between -->
  <path id="body" d="M 290 150 C 360 132 640 132 710 150 C 790 150 862 172 892 252 C 932 362 978 520 952 602 C 932 662 852 672 815 632 C 780 594 752 548 692 532 C 600 512 400 512 308 532 C 248 548 220 594 185 632 C 148 672 68 662 48 602 C 22 520 68 362 108 252 C 138 172 210 150 290 150 Z" fill="#000" opacity="0.45" filter="url(#soft)" transform="translate(0 10)"/>
  <path d="M 290 150 C 360 132 640 132 710 150 C 790 150 862 172 892 252 C 932 362 978 520 952 602 C 932 662 852 672 815 632 C 780 594 752 548 692 532 C 600 512 400 512 308 532 C 248 548 220 594 185 632 C 148 672 68 662 48 602 C 22 520 68 362 108 252 C 138 172 210 150 290 150 Z" fill="url(#core)" stroke="#05060a" stroke-width="3"/>

  <!-- the white wings, each wrapping a shoulder and the outside of its grip -->
  <path d="M 290 150 C 210 150 138 172 108 252 C 68 362 22 520 48 602 C 68 662 148 672 185 632 C 214 600 236 566 262 546 C 290 470 318 372 336 300 C 346 252 344 196 336 150 C 320 146 304 148 290 150 Z" fill="url(#wing)" stroke="#9ea4ad" stroke-width="2.5"/>
  <path d="M 710 150 C 790 150 862 172 892 252 C 932 362 978 520 952 602 C 932 662 852 672 815 632 C 786 600 764 566 738 546 C 710 470 682 372 664 300 C 654 252 656 196 664 150 C 680 146 696 148 710 150 Z" fill="url(#wing)" stroke="#9ea4ad" stroke-width="2.5"/>
  <!-- the wings' sheen along the top -->
  <path d="M 140 230 C 170 180 230 166 300 168" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M 860 230 C 830 180 770 166 700 168" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- the touchpad across the top, white, with the light bar either side -->
  <path d="M 362 146 C 420 138 580 138 638 146 L 642 286 C 642 300 632 308 618 308 L 382 308 C 368 308 358 300 358 286 Z" fill="url(#pad)" stroke="#a7adb6" stroke-width="2.5"/>
  <path d="M 372 160 C 430 152 570 152 628 160" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 349 166 L 347 292" stroke="url(#bar)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 651 166 L 653 292" stroke="url(#bar)" stroke-width="6" stroke-linecap="round"/>

  <!-- create and options, at the touchpad's top corners -->
  <rect x="318" y="146" width="16" height="30" rx="7" fill="#1c1f25" stroke="#6c727c" stroke-width="2"/>
  <path d="M 326 170 L 326 155 M 322 159 L 326 155 L 330 159" fill="none" stroke="#e6e9ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="666" y="146" width="16" height="30" rx="7" fill="#1c1f25" stroke="#6c727c" stroke-width="2"/>
  <g stroke="#e6e9ee" stroke-width="2" stroke-linecap="round">
    <path d="M 670 154 L 678 154"/><path d="M 670 161 L 678 161"/><path d="M 670 168 L 678 168"/>
  </g>

  <!-- the d-pad on the left wing: four arrow keys round a shallow dish -->
  <circle cx="250" cy="270" r="78" fill="#d3d7dd" opacity="0.3"/>
  <g fill="url(#face)" stroke="#8d939c" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 232 196 L 268 196 L 268 238 L 250 254 L 232 238 Z"/>
    <path d="M 232 344 L 268 344 L 268 302 L 250 286 L 232 302 Z"/>
    <path d="M 176 252 L 176 288 L 218 288 L 234 270 L 218 252 Z"/>
    <path d="M 324 252 L 324 288 L 282 288 L 266 270 L 282 252 Z"/>
  </g>
  <g fill="#8d939c">
    <path d="M 250 208 L 243 220 L 257 220 Z"/><path d="M 250 332 L 243 320 L 257 320 Z"/>
    <path d="M 188 270 L 200 263 L 200 277 Z"/><path d="M 312 270 L 300 263 L 300 277 Z"/>
  </g>

  <!-- the face buttons on the right wing: each its symbol, in the pad's own grey -->
  <circle cx="750" cy="270" r="96" fill="#d3d7dd" opacity="0.3"/>
  <g stroke="#8d939c" stroke-width="2.5">
    <circle cx="750" cy="212" r="27" fill="url(#face)"/>
    <circle cx="692" cy="270" r="27" fill="url(#face)"/>
    <circle cx="808" cy="270" r="27" fill="url(#face)"/>
    <circle cx="750" cy="328" r="27" fill="url(#face)"/>
  </g>
  <g fill="none" stroke="#6f7680" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 750 199 L 763 221 L 737 221 Z"/>
    <rect x="682" y="260" width="20" height="20"/>
    <circle cx="808" cy="270" r="11"/>
    <path d="M 740 318 L 760 338 M 760 318 L 740 338"/>
  </g>

  <!-- the sticks, level in the black middle -->
  <circle cx="390" cy="410" r="62" fill="url(#well)" stroke="#2c3037" stroke-width="3"/>
  <circle cx="390" cy="410" r="45" fill="url(#cap)" stroke="#050608" stroke-width="3"/>
  <circle cx="390" cy="410" r="33" fill="none" stroke="#3a3f47" stroke-width="5" stroke-dasharray="4 5"/>
  <circle cx="390" cy="410" r="21" fill="#17191d"/>
  <circle cx="390" cy="410" r="45" fill="url(#gloss)" opacity="0.6"/>
  <g fill="#8f97a3">
    <path d="M 390 340 L 383 350 L 397 350 Z"/><path d="M 390 480 L 383 470 L 397 470 Z"/>
    <path d="M 320 410 L 330 403 L 330 417 Z"/><path d="M 460 410 L 450 403 L 450 417 Z"/>
  </g>
  <circle cx="610" cy="410" r="62" fill="url(#well)" stroke="#2c3037" stroke-width="3"/>
  <circle cx="610" cy="410" r="45" fill="url(#cap)" stroke="#050608" stroke-width="3"/>
  <circle cx="610" cy="410" r="33" fill="none" stroke="#3a3f47" stroke-width="5" stroke-dasharray="4 5"/>
  <circle cx="610" cy="410" r="21" fill="#17191d"/>
  <circle cx="610" cy="410" r="45" fill="url(#gloss)" opacity="0.6"/>
  <g fill="#8f97a3">
    <path d="M 610 340 L 603 350 L 617 350 Z"/><path d="M 610 480 L 603 470 L 617 470 Z"/>
    <path d="M 540 410 L 550 403 L 550 417 Z"/><path d="M 680 410 L 670 403 L 670 417 Z"/>
  </g>

  <!-- the home button and the mute button between the sticks: neither is a place -->
  <circle cx="500" cy="402" r="17" fill="#15171b" stroke="#5c626c" stroke-width="2"/>
  <circle cx="500" cy="402" r="7" fill="none" stroke="#9aa1ab" stroke-width="2"/>
  <rect x="484" y="440" width="32" height="10" rx="5" fill="#15171b" stroke="#5c626c" stroke-width="1.5"/>
  <path d="M 490 445 L 510 445" stroke="#ff9a6a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- the speaker grille under the touchpad -->
  <g fill="#3a3e46">
    <circle cx="480" cy="330" r="2.2"/><circle cx="490" cy="330" r="2.2"/><circle cx="500" cy="330" r="2.2"/><circle cx="510" cy="330" r="2.2"/><circle cx="520" cy="330" r="2.2"/>
    <circle cx="485" cy="338" r="2.2"/><circle cx="495" cy="338" r="2.2"/><circle cx="505" cy="338" r="2.2"/><circle cx="515" cy="338" r="2.2"/>
  </g>

  <!-- where each place sits, as the screen's spots table says it -->
  <g id="spots" fill="none">
    <circle data-code="axis:4:1" cx="250" cy="90" r="0"/>
    <circle data-code="button:9" cx="250" cy="136" r="0"/>
    <circle data-code="button:11" cx="250" cy="220" r="0"/>
    <circle data-code="button:13" cx="200" cy="270" r="0"/>
    <circle data-code="button:14" cx="300" cy="270" r="0"/>
    <circle data-code="button:12" cx="250" cy="320" r="0"/>
    <circle data-code="button:4" cx="326" cy="161" r="0"/>
    <circle data-code="axis:1:-1" cx="390" cy="345" r="0"/>
    <circle data-code="axis:0:-1" cx="325" cy="410" r="0"/>
    <circle data-code="button:7" cx="390" cy="410" r="0"/>
    <circle data-code="axis:0:1" cx="455" cy="410" r="0"/>
    <circle data-code="axis:1:1" cx="390" cy="475" r="0"/>
    <circle data-code="button:6" cx="674" cy="161" r="0"/>
    <circle data-code="axis:5:1" cx="750" cy="90" r="0"/>
    <circle data-code="button:10" cx="750" cy="136" r="0"/>
    <circle data-code="button:3" cx="750" cy="212" r="0"/>
    <circle data-code="button:2" cx="692" cy="270" r="0"/>
    <circle data-code="button:1" cx="808" cy="270" r="0"/>
    <circle data-code="button:0" cx="750" cy="328" r="0"/>
    <circle data-code="axis:3:-1" cx="610" cy="345" r="0"/>
    <circle data-code="axis:2:-1" cx="545" cy="410" r="0"/>
    <circle data-code="button:8" cx="610" cy="410" r="0"/>
    <circle data-code="axis:2:1" cx="675" cy="410" r="0"/>
    <circle data-code="axis:3:1" cx="610" cy="475" r="0"/>
  </g>
</svg>
