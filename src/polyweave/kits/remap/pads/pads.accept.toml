# What every remap pad picture holds (§PW428), checked against core/pads/<layout>.png:
# the pad fills most of its 1000 x 667 frame, stands wider than tall as a pad does, and
# keeps its layout's colours to a few, so the screen's lit rings read over it.
asset = "remap-pad"

[[predicate]]
id = "fills-its-frame"
measure = "alpha_coverage"
region = "frame"
min = 0.55
max = 0.85

[[predicate]]
id = "a-pad-s-shape"
measure = "silhouette_aspect"   # height over width: a pad is wider than tall
# 0.55, not the 0.6 first guessed off drawings: the DualSense rendered from its model
# measures 0.592, and a real pad is the reference now (2026-10-14).
min = 0.55
max = 0.85

[[predicate]]
id = "few-colours"
measure = "hue_spread"
# 0.6, not 0.5: the Xbox pad's own A, B, X and Y are green, red, blue and yellow, and
# its render measures 0.53 with them; a pad wearing every hue still fails (2026-10-14).
max = 0.6
