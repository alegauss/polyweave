name = "remap"
version = "0.5.0"
summary = "rebinding on the keys and the pad apart, a clash swapped, kept across restarts, reset to the game's own"
requires = ["prompts"]
tab = "controls"

[installs]
core = "core"
scene = "scene/remap_menu.tscn"

[declares]
file = "user://polyweave_bindings.cfg"
halves = ["keys", "pad"]
conflict = "swap"

[proves]
spec = "proof.accept.toml"
fixture = "fixture"
script = "core/proof.gd"

[changes]
"0.1.0" = "the binding store extracted from Starship, its swap and reset, and a remap screen drawn with the prompts kit's icons"
"0.2.0" = "a controls tab on the options kit's screen, a row that opens the remap screen"
"0.2.1" = "its proof works on actions of its own, so it holds in a game whatever actions the game has"
"0.2.2" = "a rebound pad binding answers every pad, as the project's own do, not pad 0 alone"
"0.3.0" = "a game's older bindings file, declared as FROM, taken once on the first launch with the kit"
"0.4.0" = "the pad drawn as a picture from a layout's spots table, a press lighting its place, a rebind on the picture swapped as on the remap screen"
"0.4.1" = "the Xbox, PlayStation and Switch pads drawn behind the places, each spots table held to its drawing"
"0.4.2" = "the pad screen names its places through the prompts kit, a generic pad by where its buttons sit"
"0.5.0" = "the remap screen binds on release and cancels on a held press, says its words through the game's table, and shows each action's declared label in the declared order"
