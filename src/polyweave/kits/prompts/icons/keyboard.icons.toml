# The keyboard and mouse family's prompts: a keycap per key, by the name Godot's
# OS.get_keycode_string gives it, and the three mouse buttons.
name = "keyboard"
sizes = [64]

[style]
fill = "#E9E9EC"
symbol_colour = "#202024"

