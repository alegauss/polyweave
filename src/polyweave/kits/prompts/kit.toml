name = "prompts"
version = "0.5.0"
summary = "button prompts for the pad in the player's hands, switched live, drawn as icons"
requires = []

[installs]
core = "core"
scene = "scene/prompt_legend.tscn"

[declares]
families = ["xbox", "playstation", "switch", "generic", "keyboard"]
icons = "res://addons/polyweave/prompts/icons"

[proves]
spec = "proof.accept.toml"
fixture = "fixture"
script = "core/proof.gd"

[changes]
"0.1.0" = "the four families, drawn by icons.build, and a service that follows the device"
"0.2.0" = "a binding in words per player and family, and fill over {action} and {move} marks"
"0.3.0" = "a family per player moved only by their own device, and an unplugged pad handed on"
"0.4.0" = "a generic family for a pad nobody names, every stored code named in any family, a binding's codes in one row, the clicks as each family prints them"
"0.5.0" = "a label watched and kept filled, and a follower run, on a device, binding or language change"
