name = "saves"
version = "0.2.2"
summary = "saves in slots through a temporary file and a rename, a sum, the save before, and migrations by version"
requires = []

[installs]
core = "core"

[declares]
dir = "user://saves"
declaration = "res://polyweave_saves.gd"

[proves]
fixture = "fixture"
script = "core/proof.gd"

[changes]
"0.1.0" = "slots written safely, read with a fallback, brought up through the project's migrations"
"0.2.0" = "a game's older save, read by the project's adopted(), taken into slot 0 once and said"
"0.2.1" = "its scripts name one another by a _Pw name, so a game's own class of the same name, a Bindings or a Settings, cannot shadow them"
"0.2.2" = "adopted(folder) is handed the store's folder, and the proof runs within the slots the game declares"
