name = "remap"
version = "0.9.1"
summary = "rebinding on the keys and the pad apart, a clash swapped, kept across restarts, reset to the game's own"
requires = ["prompts"]
tab = "controls"

[installs]
core = "core"
scene = "scene/remap_menu.tscn"

[declares]
file = "user://polyweave_bindings.cfg"
halves = ["keys", "pad"]
conflict = "swap"

[proves]
spec = "proof.accept.toml"
fixture = "fixture"
script = "core/proof.gd"

[changes]
"0.1.0" = "the binding store extracted from Starship, its swap and reset, and a remap screen drawn with the prompts kit's icons"
"0.2.0" = "a controls tab on the options kit's screen, a row that opens the remap screen"
"0.2.1" = "its proof works on actions of its own, so it holds in a game whatever actions the game has"
"0.2.2" = "a rebound pad binding answers every pad, as the project's own do, not pad 0 alone"
"0.3.0" = "a game's older bindings file, declared as FROM, taken once on the first launch with the kit"
"0.4.0" = "the pad drawn as a picture from a layout's spots table, a press lighting its place, a rebind on the picture swapped as on the remap screen"
"0.4.1" = "the Xbox, PlayStation and Switch pads drawn behind the places, each spots table held to its drawing"
"0.4.2" = "the pad screen names its places through the prompts kit, a generic pad by where its buttons sit"
"0.5.0" = "the remap screen binds on release and cancels on a held press, says its words through the game's table, and shows each action's declared label in the declared order"
"0.6.0" = "the bindings kept in the game's own settings file and section, the deadzone's default and range and pad options of the game's own declared, and one shared store"
"0.6.1" = "every rebind, reset and load tells the prompts kit, so its watched labels refill"
"0.6.2" = "its scripts name one another by a _Pw name, so a game's own class of the same name, a Bindings or a Settings, cannot shadow them"
"0.6.3" = "its proof writes under a folder of its own run and reads the screen's words in a language of its own, so a game with its own rows in the player's language holds"
"0.6.4" = "its proof sets its own language again once the game's autoloads have set the player's, and reads a swap by the two actions it names, in any language"
"0.6.5" = "its proof expects the game's own row for a word where the game has one in its fallback language, and the kit's English only where it has none"
"0.7.0" = "the remap and pad screens bind on the game's shared store, which says changed on every rebind, reset and load"
"0.8.0" = "the remap screen says listening and listened, answers is_listening, and repaints its rows in place so a bind keeps the focus"
"0.9.0" = "the pad screen reads the declared labels and names its buttons in its help, and both screens confirm and go back on a declared CONFIRM and BACK"
"0.9.1" = "a kept or older file that names only the actions a player changed loads with no engine error for the rest"
