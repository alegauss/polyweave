<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 66 1040 693" width="1000" height="667">
  <!-- The remap kit's Switch-layout pad (§PW428), in line, as the console's own
       button-mapping screen draws its Pro Controller, its proportions measured off that
       screen: ZL and ZR behind L and R on the shoulders, the left stick above the d-pad,
       the face buttons above the right stick, minus and plus, capture and home between,
       and long grips. Letters are strokes, since the rasteriser draws no text. Thin
       light lines over a faint fill, for a dark ground. The "spots" group at the end
       draws nothing: it is where each place sits, and core/pads/switch.json is held to
       it. No maker's mark. -->
  <g fill="none" stroke="#e8ecf2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <!-- ZL and ZR, slivers behind the shoulders -->
    <path d="M 222 118 C 242 92 322 84 366 96 L 370 114 C 322 106 262 108 222 118 Z" fill="#ffffff" fill-opacity="0.08"/>
    <path d="M 874 118 C 854 92 774 84 730 96 L 726 114 C 774 106 834 108 874 118 Z" fill="#ffffff" fill-opacity="0.08"/>
    <!-- L and R, along the shoulders -->
    <path d="M 158 170 C 182 132 262 110 370 114 L 372 132 C 282 130 206 148 172 184 Z" fill="#ffffff" fill-opacity="0.05"/>
    <path d="M 938 170 C 914 132 834 110 726 114 L 724 132 C 814 130 890 148 924 184 Z" fill="#ffffff" fill-opacity="0.05"/>

    <!-- the body: a straight top, the grips running long and splaying out -->
    <path d="M 548 122 C 646 120 716 121 766 126 C 836 132 901 145 936 178 C 961 205 971 260 978 330 C 988 400 1011 520 1024 620 C 1032 690 1011 745 956 752 C 911 756 891 730 871 680 C 851 630 816 585 776 556 C 766 552 756 551 746 551 L 350 551 C 340 551 330 552 320 556 C 280 585 245 630 225 680 C 205 730 185 756 140 752 C 85 745 64 690 72 620 C 85 520 108 400 118 330 C 125 260 135 205 160 178 C 195 145 260 132 330 126 C 380 121 450 120 548 122 Z" fill="#ffffff" fill-opacity="0.05"/>
    <!-- the face's top edge, and where the face turns into each grip -->
    <path d="M 178 176 C 320 150 776 150 918 176" stroke-width="2" opacity="0.7"/>
    <path d="M 122 322 C 180 420 260 500 330 550" stroke-width="2" opacity="0.7"/>
    <path d="M 974 322 C 916 420 836 500 766 550" stroke-width="2" opacity="0.7"/>

    <!-- the left stick: its ring, its cap, an L -->
    <circle cx="280" cy="290" r="74" stroke-width="2.4" opacity="0.85"/>
    <circle cx="280" cy="290" r="48" fill="#ffffff" fill-opacity="0.08"/>
    <path d="M 270 274 L 270 306 L 292 306" stroke-width="3.4"/>

    <!-- the d-pad, one cross with a dot on each arm -->
    <path d="M 375 350 L 419 350 L 419 398 L 467 398 L 467 442 L 419 442 L 419 490 L 375 490 L 375 442 L 327 442 L 327 398 L 375 398 Z" fill="#ffffff" fill-opacity="0.08"/>
    <g stroke-width="0" fill="#e8ecf2">
      <circle cx="397" cy="368" r="3.5"/><circle cx="397" cy="472" r="3.5"/>
      <circle cx="345" cy="420" r="3.5"/><circle cx="449" cy="420" r="3.5"/>
    </g>

    <!-- minus and plus -->
    <circle cx="430" cy="213" r="19" stroke-width="2.4"/>
    <path d="M 420 213 L 440 213" stroke-width="3"/>
    <circle cx="665" cy="213" r="19" stroke-width="2.4"/>
    <path d="M 655 213 L 675 213 M 665 203 L 665 223" stroke-width="3"/>
    <!-- capture, a square with a dot; home, a ring with a house -->
    <rect x="462" y="270" width="36" height="36" rx="5" stroke-width="2.4"/>
    <circle cx="480" cy="288" r="7" stroke-width="2.2"/>
    <circle cx="620" cy="288" r="23" stroke-width="2.4"/>
    <path d="M 609 292 L 620 281 L 631 292 L 631 299 L 609 299 Z" stroke-width="2.2"/>

    <!-- the face buttons: X on top, Y left, A right, B below, each its letter -->
    <circle cx="800" cy="222" r="34"/>
    <circle cx="727" cy="288" r="34"/>
    <circle cx="877" cy="288" r="34"/>
    <circle cx="800" cy="352" r="34"/>
    <g stroke-width="3.4">
      <path d="M 789 210 L 811 234 M 811 210 L 789 234"/>
      <path d="M 717 276 L 727 289 L 737 276 M 727 289 L 727 301"/>
      <path d="M 866 301 L 877 275 L 888 301 M 870 292 L 884 292"/>
      <path d="M 791 340 L 791 364 L 803 364 Q 811 364 811 358 Q 811 352 803 352 L 791 352 M 803 352 Q 809 352 809 346 Q 809 340 802 340 L 791 340"/>
    </g>

    <!-- the right stick: its ring, its cap, an R -->
    <circle cx="670" cy="415" r="74" stroke-width="2.4" opacity="0.85"/>
    <circle cx="670" cy="415" r="48" fill="#ffffff" fill-opacity="0.08"/>
    <path d="M 660 431 L 660 399 L 673 399 Q 682 399 682 407 Q 682 415 673 415 L 660 415 M 671 415 L 682 431" stroke-width="3.4"/>
  </g>

  <!-- where each place sits, as the screen's spots table says it -->
  <g id="spots" fill="none">
    <circle data-code="axis:4:1" cx="294" cy="100" r="0"/>
    <circle data-code="button:9" cx="266" cy="136" r="0"/>
    <circle data-code="button:4" cx="430" cy="213" r="0"/>
    <circle data-code="axis:1:-1" cx="280" cy="230" r="0"/>
    <circle data-code="axis:0:-1" cx="220" cy="290" r="0"/>
    <circle data-code="button:7" cx="280" cy="290" r="0"/>
    <circle data-code="axis:0:1" cx="340" cy="290" r="0"/>
    <circle data-code="axis:1:1" cx="280" cy="350" r="0"/>
    <circle data-code="button:11" cx="397" cy="372" r="0"/>
    <circle data-code="button:13" cx="349" cy="420" r="0"/>
    <circle data-code="button:14" cx="445" cy="420" r="0"/>
    <circle data-code="button:12" cx="397" cy="468" r="0"/>
    <circle data-code="axis:5:1" cx="802" cy="100" r="0"/>
    <circle data-code="button:10" cx="830" cy="136" r="0"/>
    <circle data-code="button:6" cx="665" cy="213" r="0"/>
    <circle data-code="button:3" cx="800" cy="222" r="0"/>
    <circle data-code="button:2" cx="727" cy="288" r="0"/>
    <circle data-code="button:1" cx="877" cy="288" r="0"/>
    <circle data-code="button:0" cx="800" cy="352" r="0"/>
    <circle data-code="axis:3:-1" cx="670" cy="355" r="0"/>
    <circle data-code="axis:2:-1" cx="610" cy="415" r="0"/>
    <circle data-code="button:8" cx="670" cy="415" r="0"/>
    <circle data-code="axis:2:1" cx="730" cy="415" r="0"/>
    <circle data-code="axis:3:1" cx="670" cy="475" r="0"/>
  </g>
</svg>
