name = "players"
version = "0.3.0"
summary = "a second player joining on any free pad, each player's actions on their own pad alone, rebound apart"
requires = ["remap"]

[installs]
core = "core"

[declares]
declaration = "res://polyweave_players.gd"
max_players = 2

[proves]
fixture = "fixture"
script = "core/proof.gd"

[changes]
"0.1.0" = "join on a free pad, every action copied per player on that pad alone, rebinds kept apart, a leave freeing the pad"
"0.2.0" = "join_asked, AUTO_JOIN for a join the game answers, and SHARED_LAYOUT for one layout"
"0.2.1" = "its scripts name one another by a _Pw name, so a game's own class of the same name, a Bindings or a Settings, cannot shadow them"
"0.2.2" = "its proof rebinds on a store of its own run, never the game's declared one, and holds in a game that answers its own joins"
"0.3.0" = "the players sit on the shared store and follow it, so a rebind on the remap screen keeps each pad on its player's actions"
