# What the layout split moved (§PW499 and the lines after it in block W), read by
# `python -m polyweave migrate` to carry a project's own Python and polyweave.toml across.
#
# Data, not code: a module that moves again gets one more line here, and the command
# needs no edit. Every target is checked against the package by tests/test_migrate.py,
# so a line pointing at a module that is not there fails the gate, not an adopter.

# The old dotted path under `polyweave.` to the new one, whole. A submodule of an old
